name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "refactor/**"
      - "docs/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-policy:
    name: Padrao de commits e branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar padroes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: pwsh
        run: .github/scripts/verify_commit_policy.ps1

  flutter-quality:
    name: Qualidade Flutter
    runs-on: ubuntu-latest
    needs: commit-policy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formatacao
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Analisar codigo
        run: flutter analyze

      - name: Rodar testes
        run: flutter test --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  backend-quality:
    name: Qualidade Backend
    runs-on: ubuntu-latest
    needs: commit-policy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Verificar sintaxe Python
        run: python -m compileall backend/app

      - name: Verificar formatacao Python
        working-directory: backend
        run: ruff format --check app

      - name: Analisar codigo Python
        working-directory: backend
        run: ruff check app

  repository-quality:
    name: Qualidade do repositorio
    runs-on: ubuntu-latest
    needs: commit-policy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verificar formatacao de docs e configs
        run: npx --yes prettier@3.5.3 --check "**/*.{md,yml,yaml,json}"

  release-build:
    name: Build Android para release
    runs-on: ubuntu-latest
    needs:
      - flutter-quality
      - backend-quality
      - repository-quality
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Gerar APK release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: vcos-${{ github.ref_name }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
