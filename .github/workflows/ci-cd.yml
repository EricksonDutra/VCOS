name: CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
      - "fix/**"
      - "hotfix/**"
      - "refactor/**"
      - "docs/**"
    tags:
      - "v*.*.*"
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-policy:
    name: Padrao de commits e branches
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validar padroes
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
        shell: pwsh
        run: .github/scripts/verify_commit_policy.ps1

  quality:
    name: Qualidade Flutter
    runs-on: ubuntu-latest
    needs: commit-policy

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Verificar formatacao
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Analisar codigo
        run: flutter analyze

      - name: Rodar testes
        run: flutter test --coverage

      - name: Publicar cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: ignore

  release-build:
    name: Build Android para release
    runs-on: ubuntu-latest
    needs: quality
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Configurar Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Gerar APK release
        run: flutter build apk --release

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: vcos-${{ github.ref_name }}-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
