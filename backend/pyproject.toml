[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app"]

[tool.ruff.lint]
select = [
  "A",
  "ARG",
  "ASYNC",
  "B",
  "BLE",
  "C4",
  "C90",
  "COM",
  "DTZ",
  "E",
  "F",
  "FAST",
  "I",
  "ISC",
  "N",
  "PERF",
  "PIE",
  "PL",
  "PTH",
  "RET",
  "RUF",
  "S",
  "SIM",
  "T20",
  "UP",
  "W"
]
ignore = [
  "COM812",
  "ISC001"
]

[tool.ruff.lint.per-file-ignores]
"app/main.py" = ["S104"]
"app/schemas/*.py" = ["N805"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
